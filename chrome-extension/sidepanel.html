<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <div class="halftone-bg"></div>

    <header>
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
            </div>
            <h1>WebRAG!</h1>
        </div>
        <p>Chat with any webpage — POW!</p>
    </header>

    <div class="page-info">
        <span class="label">&#9654; ACTIVE PAGE</span>
        <p id="page-url">Open a webpage to get started.</p>
    </div>

    <main>
        <label for="question">YOUR QUESTION</label>

        <div class="textarea-wrap">
            <textarea
                id="question"
                placeholder="What is this page about?!"
                rows="4"
            ></textarea>
        </div>

        <button id="ask-button">
            <span class="btn-text">ASK WEBRAG</span>
            <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>

        <p id="status"></p>

        <section id="answer-section" hidden>
            <div class="section-divider">
                <span class="divider-text">★ ANSWER ★</span>
            </div>
            <div id="answer"></div>

            <h3>&#128279; SOURCES</h3>
            <div id="sources"></div>
        </section>
    </main>

    <script src="sidepanel.js"></script>
</body>
</html>
